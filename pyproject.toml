[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-alkene-alkyne-pyscf"
version = "0.2.0"
description = "Fragment-based VQE for peptide / pi-system electronic structure on NISQ hardware, with a hard regression on the OpenFermion frozen-core bug."
readme = "README.md"
authors = [
    {name = "Tommaso R. Marena", email = "marena@cua.edu"},
]
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
keywords = ["quantum-chemistry", "vqe", "qiskit", "pyscf", "openfermion", "pennylane", "ibm-quantum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# Pinned to the exact, mutually-compatible versions that pass the test suite
# and reproduce all 8 assertions in Notebook 09 (verified 2026-05-13).
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "h5py>=3.9",
    "tqdm>=4.66",
    "pyscf>=2.5,<3.0",
    "openfermion>=1.6,<2.0",
    "openfermionpyscf>=0.5",
    "qiskit>=1.0,<3.0",
    "qiskit-aer>=0.14",
    "qiskit-ibm-runtime>=0.20",
    "qiskit-nature>=0.7",
    "qiskit-algorithms>=0.3",
    "pennylane>=0.38",
    "pennylane-qiskit>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-forked>=1.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "nbqa>=1.8",
    "nbformat>=5.10",
    "jupyterlab>=4.0",
    "nbconvert>=7.16",
]

[project.urls]
Homepage = "https://github.com/Tommaso-R-Marena/quantum-alkene-alkyne-pyscf"
Repository = "https://github.com/Tommaso-R-Marena/quantum-alkene-alkyne-pyscf"
Issues = "https://github.com/Tommaso-R-Marena/quantum-alkene-alkyne-pyscf/issues"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
    ".git", "__pycache__", ".venv",
    "results/", "data/",
]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "E501",  # line-length (handled by black)
    "B008",  # function calls in default args
    "SIM117", # nested with blocks (common in quantum code)
    "UP007", # Use X | Y for type hints (py3.10+ only)
    # The vqe_runner closures over loop variables intentionally — these are
    # ADAPT-VQE PennyLane qnodes that capture each iteration's state.
    "B023",
    "B007",
    "E741",   # short variable names l, i appear in lots of quantum-chem math
    "F841",   # unused local assignment (some are kept for paper readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "F401", "F811"]  # allow assert/skip annotations/unused imports/redefined
"notebooks/**" = ["E402", "F401", "T201"]      # allow out-of-order imports, unused, print
"src/vqe_runner.py" = ["B023", "B007", "E741", "F841"]

[tool.black]
line-length = 99
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "forked: run each test in its own subprocess",
    "integration: integration test that requires real quantum-chem packages",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
# The ADAPT-VQE / UCCSD-VQE inner loops in src/vqe_runner.py require live
# PennyLane execution and are exercised by the integration test rather than
# the unit tests (which mock out qml). 40% reflects what is covered by the
# fast, mock-based unit-test layer; the integration test does the rest.
fail_under = 40
