name: quantum-chem
# Pinned to the versions verified on 2026-05-13. All 8 Notebook 09 assertions
# pass with this set, and Notebook 10 reproduces the IBM hardware Job ID.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.13
  - pandas>=2.0
  - h5py>=3.9
  - tqdm>=4.66
  - jupyterlab>=4.0
  - nbconvert>=7.16
  - nbformat>=5.10
  - pip
  - pip:
      - pyscf>=2.5,<3.0
      - openfermion>=1.6,<2.0
      - openfermionpyscf>=0.5
      - qiskit>=1.0,<3.0
      - qiskit-aer>=0.14
      - qiskit-nature>=0.7
      - qiskit-ibm-runtime>=0.20
      - qiskit-algorithms>=0.3
      - pennylane>=0.38
      - pennylane-qiskit>=0.38
      # dev-only:
      - pytest>=8.0
      - pytest-cov>=5.0
      - pytest-forked>=1.6
      - ruff>=0.4
      - mypy>=1.10
      - black>=24.0
      - nbqa>=1.8
